  <!-- notch / inner top blue area -->
  <path fill="url(#bgBlue)" d="M346 170h334v88c0 31-25 56-56 56H402c-31 0-56-25-56-56z"/>

  <!-- clip head -->
  <rect x="361" y="94" width="302" height="120" rx="43" fill="url(#bgBlue)"/>
  <rect x="417" y="140" width="190" height="40" rx="20" fill="#FFFFFF"/>

  <!-- page lines -->
  <rect x="274" y="416" width="434" height="72" rx="36" fill="url(#lineBlue)"/>
  <rect x="274" y="549" width="324" height="72" rx="36" fill="url(#lineBlue)"/>
  <rect x="274" y="682" width="178" height="72" rx="36" fill="url(#lineBlue)"/>

  <!-- cloud sits on lower-right of paper -->
  <g transform="translate(430,584)">
    <path fill="#FFFFFF" d="M374 32c86 0 158 57 181 136 16-3 33-5 50-5 98 0 178 80 178 178s-80 178-178 178H118C53 519 0 466 0 401s53-118 118-118c20 0 39 5 56 14 26-156 104-265 200-265z"/>
    <path fill="url(#cloudBlue)" d="M347 53c81 0 148 55 168 130 15-3 31-4 46-4 90 0 163 73 163 163s-73 163-163 163H105c-60 0-109-49-109-109s49-109 109-109c18 0 36 4 52 13 24-143 96-247 190-247z"/>
  </g>
