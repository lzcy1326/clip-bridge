<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="ClipBridge cloud clipboard icon">
  <title>ClipBridge cloud clipboard icon</title>
  <defs>
    <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C73FF"/>
      <stop offset="100%" stop-color="#1889FF"/>
    </linearGradient>
    <linearGradient id="lineBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5DBBFF"/>
      <stop offset="100%" stop-color="#4CADF4"/>
    </linearGradient>
    <linearGradient id="cloudBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4DB7FF"/>
      <stop offset="100%" stop-color="#46ADF2"/>
    </linearGradient>
  </defs>

  <!-- outer clipboard -->
  <path fill="url(#bgBlue)" d="M245 170h132c8-38 42-67 83-67h103c41 0 75 29 83 67h133c66 0 119 53 119 119v523c0 66-53 119-119 119H245c-66 0-119-53-119-119V289c0-66 53-119 119-119z"/>

  <!-- paper -->
