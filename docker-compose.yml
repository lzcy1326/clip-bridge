services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipbridge}
      POSTGRES_USER: ${POSTGRES_USER:-clipbridge_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipbridge_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  server:
    build:
      context: ./server
    environment:
      CLIPBRIDGE_SERVER_ADDR: 0.0.0.0:8080
      CLIPBRIDGE_JWT_SECRET: ${CLIPBRIDGE_JWT_SECRET:?set CLIPBRIDGE_JWT_SECRET in .env}
      CLIPBRIDGE_DATABASE_URL: postgres://${POSTGRES_USER:-clipbridge_dev}:${POSTGRES_PASSWORD:-clipbridge_dev_only}@postgres:5432/${POSTGRES_DB:-clipbridge}?sslmode=disable
      CLIPBRIDGE_IMAGE_DIR: /var/lib/clipbridge/images
    volumes:
      - clipbridge_images:/var/lib/clipbridge/images
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CLIPBRIDGE_SERVER_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  clipbridge_images:
